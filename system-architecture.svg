<svg width="100%" viewBox="0 0 680 710" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
    .th  { font-size: 14px; font-weight: 600; fill: #1e293b; }
    .ts  { font-size: 12px; font-weight: 400; fill: #64748b; }
    .box-gray   { fill: #f1f5f9; stroke: #94a3b8; }
    .box-amber  { fill: #fef3c7; stroke: #d97706; }
    .box-blue   { fill: #dbeafe; stroke: #3b82f6; }
    .box-teal   { fill: #d1fae5; stroke: #10b981; }
    .box-purple { fill: #ede9fe; stroke: #8b5cf6; }
    .arr        { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .arr-dash   { stroke: #94a3b8; stroke-width: 1; fill: none; stroke-dasharray: 5 4; }
    .legend-box { stroke-width: 0.5; }
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Arrows -->
<line x1="340" y1="74"  x2="340" y2="108" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="166" x2="340" y2="198" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="256" x2="340" y2="303" class="arr" marker-end="url(#arrow)"/>
<path d="M263 361 L263 390 L120 390 L120 413" class="arr" marker-end="url(#arrow)"/>
<path d="M418 361 L418 390 L420 390 L420 413" class="arr" marker-end="url(#arrow)"/>
<path d="M420 471 L420 498 L290 498 L290 523" class="arr" marker-end="url(#arrow)"/>
<path d="M420 471 L420 498 L490 498 L490 523" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="551" x2="382" y2="551" class="arr" marker-end="url(#arrow)"/>
<path d="M490 616 L490 594 L290 594 L290 579" class="arr-dash" marker-end="url(#arrow-dash)"/>
<text class="ts" x="388" y="589" text-anchor="middle">ingestion</text>

<!-- Row 1: Client -->
<rect x="230" y="30"  width="220" height="44" rx="8" class="box-gray"   stroke-width="0.5"/>
<text class="th" x="340" y="57" text-anchor="middle">Client browser</text>

<!-- Row 2: Cloudflare -->
<rect x="195" y="110" width="290" height="56" rx="8" class="box-amber"  stroke-width="0.5"/>
<text class="th" x="340" y="132" text-anchor="middle">Cloudflare Zero Trust</text>
<text class="ts" x="340" y="150" text-anchor="middle">Secure external access · HTTPS</text>

<!-- Row 3: Frontend -->
<rect x="185" y="200" width="310" height="56" rx="8" class="box-blue"   stroke-width="0.5"/>
<text class="th" x="340" y="222" text-anchor="middle">Next.js frontend  :3000</text>
<text class="ts" x="340" y="240" text-anchor="middle">React · Tailwind · RTL · i18n · PM2</text>

<!-- Row 4: Backend -->
<rect x="185" y="305" width="310" height="56" rx="8" class="box-blue"   stroke-width="0.5"/>
<text class="th" x="340" y="327" text-anchor="middle">Node.js backend  :3001</text>
<text class="ts" x="340" y="345" text-anchor="middle">Express · Auth · RBAC · PM2</text>

<!-- Row 5L: PostgreSQL -->
<rect x="20"  y="415" width="200" height="56" rx="8" class="box-teal"   stroke-width="0.5"/>
<text class="th" x="120" y="437" text-anchor="middle">PostgreSQL 15</text>
<text class="ts" x="120" y="455" text-anchor="middle">Auth · history · RBAC</text>

<!-- Row 5R: n8n -->
<rect x="320" y="415" width="200" height="56" rx="8" class="box-purple" stroke-width="0.5"/>
<text class="th" x="420" y="437" text-anchor="middle">n8n workflow</text>
<text class="ts" x="420" y="455" text-anchor="middle">RAG Hybrid-v3 pipeline</text>

<!-- Row 6L: Qdrant -->
<rect x="200" y="525" width="180" height="56" rx="8" class="box-purple" stroke-width="0.5"/>
<text class="th" x="290" y="547" text-anchor="middle">Qdrant  :6333</text>
<text class="ts" x="290" y="565" text-anchor="middle">700+ vector points</text>

<!-- Row 6R: Ollama -->
<rect x="400" y="525" width="180" height="56" rx="8" class="box-purple" stroke-width="0.5"/>
<text class="th" x="490" y="547" text-anchor="middle">Ollama  :11434</text>
<text class="ts" x="490" y="565" text-anchor="middle">qwen2.5:3b · nomic-embed</text>

<!-- Row 7: Nextcloud (dashed border) -->
<rect x="400" y="616" width="180" height="44" rx="8" class="box-gray"   stroke-width="0.5" stroke-dasharray="6 4"/>
<text class="th" x="490" y="643" text-anchor="middle">Nextcloud  :8080</text>

<!-- Legend -->
<rect x="30" y="620" width="12" height="12" rx="2" class="box-blue"   legend-box/>
<text class="ts" x="48" y="631">Application</text>
<rect x="30" y="640" width="12" height="12" rx="2" class="box-teal"   legend-box/>
<text class="ts" x="48" y="651">Data</text>
<rect x="130" y="620" width="12" height="12" rx="2" class="box-purple" legend-box/>
<text class="ts" x="148" y="631">AI layer</text>
<rect x="130" y="640" width="12" height="12" rx="2" class="box-gray"   legend-box/>
<text class="ts" x="148" y="651">Infrastructure</text>
</svg>
